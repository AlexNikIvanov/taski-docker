[settings]
profile=black
py_version=311
multi_line_output=2
line_length=79
# default_section=THIRDPARTY
include_trailing_comma = True
force_grid_wrap = 0
combine_as_imports = True
skip= .git,
    __pycache__,
    venv,
    .venv,
    migrations
# known_django=django
force_sort_within_sections = true
combine_as_imports = true
known_first_party=api, backend, frontend
known_third_party = drf_nested_routers, pytils, requests, django, rest_framework
sections=FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER